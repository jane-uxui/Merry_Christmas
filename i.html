<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 트리 만들기</title>
  <style>
    :root {
      --bg-cream: #fbf6ee;
      --bg-card: #fffdf9;
      --ink-main: #233329;
      --ink-sub: #67766c;
      --tree-deep: #274a38;
      --tree-mid: #35634b;
      --line-soft: #dfd8cb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background-color: #ece5d8;
      color: var(--ink-main);
      display: flex;
      justify-content: center;
      padding: 20px 12px;
    }

    .screen {
      width: 100%;
      max-width: 410px;
      background-color: var(--bg-cream);
      border-radius: 30px;
      padding: 20px 20px 26px;
      box-shadow: 0 20px 45px rgba(27, 42, 33, 0.12);
      border: 1px solid rgba(35, 51, 41, 0.08);
    }

    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .back-btn {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid var(--line-soft);
      background: var(--bg-card);
      color: var(--ink-main);
      font-size: 18px;
      cursor: pointer;
    }

    .nav-title {
      font-size: 16px;
      font-weight: 700;
    }

    .nav-spacer {
      width: 36px;
    }

    .field-block {
      margin-bottom: 20px;
    }

    .field-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .field-hint {
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-sub);
    }

    .text-input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid var(--line-soft);
      background-color: var(--bg-card);
      font-size: 14px;
      color: var(--ink-main);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .text-input:focus {
      border-color: var(--tree-deep);
    }

    .text-input::placeholder {
      color: #9ca79f;
    }

    .preview-card {
      background-color: var(--bg-card);
      border: 1px solid var(--line-soft);
      border-radius: 20px;
      padding: 18px 16px 20px;
      text-align: center;
      margin-bottom: 22px;
    }

    .preview-sub {
      font-family: "Georgia", cursive;
      font-style: italic;
      font-size: 20px;
      color: var(--ink-sub);
      line-height: 1.2;
    }

    .preview-name {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink-main);
      margin-top: 2px;
      margin-bottom: 12px;
    }

    .preview-tree {
      width: 150px;
      height: 190px;
      margin: 0 auto;
      display: block;
    }

    .ornament-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }

    .ornament-row::-webkit-scrollbar {
      display: none;
    }

    .ornament-choice {
      flex: 0 0 64px;
      height: 64px;
      border-radius: 16px;
      border: 1.5px solid var(--line-soft);
      background-color: var(--bg-card);
      font-size: 26px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .ornament-choice.active {
      border-color: var(--tree-deep);
      background-color: #eef5f0;
      box-shadow: 0 6px 14px rgba(39, 74, 56, 0.12);
    }

    .submit-btn {
      width: 100%;
      margin-top: 8px;
      padding: 15px 18px;
      border: none;
      border-radius: 16px;
      background-color: var(--tree-deep);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .submit-btn:hover {
      background-color: var(--tree-mid);
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="nav-bar">
      <button class="back-btn" type="button" aria-label="뒤로 가기">←</button>
      <span class="nav-title">내 트리 만들기</span>
      <span class="nav-spacer"></span>
    </div>

    <div class="field-block">
      <div class="field-label">
        <span>트리에 어떤 이름을 붙일까?</span>
        <span class="field-hint" id="nameCount">0/4</span>
      </div>
      <input
        id="treeNameInput"
        class="text-input"
        type="text"
        maxlength="4"
        placeholder="이름이나 별명을 4글자까지 입력해봐요"
      />
    </div>

    <div class="preview-card">
      <div class="preview-sub">Merry Christmas</div>
      <div class="preview-name" id="previewName">제인의 트리</div>
      <svg class="preview-tree" viewBox="0 0 180 230" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="78" y="186" width="24" height="32" rx="4" fill="#6D462B" />
        <polygon points="90,14 38,88 142,88" fill="#2F5D46" />
        <polygon points="90,56 26,140 154,140" fill="#264E3A" />
        <polygon points="90,102 16,190 164,190" fill="#1D3F2E" />
      </svg>
    </div>

    <div class="field-block">
      <div class="field-label">
        <span>친구들이 달아줄 장식을 골라줘</span>
        <span class="field-hint">선택 가능</span>
      </div>
      <div class="ornament-row" id="ornamentRow">
        <button class="ornament-choice active" type="button" data-item="🌸">🌸</button>
        <button class="ornament-choice" type="button" data-item="🎀">🎀</button>
        <button class="ornament-choice" type="button" data-item="⭐">⭐</button>
        <button class="ornament-choice" type="button" data-item="🧦">🧦</button>
        <button class="ornament-choice" type="button" data-item="❄️">❄️</button>
      </div>
    </div>

    <div class="field-block">
      <div class="field-label">
        <span>트리를 관리할 비밀번호를 정해줘</span>
      </div>
      <input
        class="text-input"
        type="password"
        placeholder="나중에 내 트리를 관리할 때 필요해. 꼭 기억해줘!"
      />
    </div>

    <button class="submit-btn" type="button">내 트리 완성하기</button>
  </div>

  <script>
    const nameInput = document.getElementById('treeNameInput');
    const previewName = document.getElementById('previewName');
    const nameCount = document.getElementById('nameCount');
    const choices = document.querySelectorAll('.ornament-choice');

    nameInput.addEventListener('input', () => {
      const val = nameInput.value.trim();
      nameCount.textContent = `${nameInput.value.length}/4`;
      previewName.textContent = val ? `${val}의 트리` : '제인의 트리';
    });

    choices.forEach((btn) => {
      btn.addEventListener('click', () => {
        choices.forEach((el) => el.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>
</body>
</html>
